name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric lädt Android-Runtime-JARs nach ~/.m2 – mitcachen spart pro Lauf Minuten
      - name: Robolectric-Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  lint:
    name: Android Lint (informativ)
    runs-on: ubuntu-latest
    # Erst beobachten, nicht blockieren: sobald lint sauber läuft, kann
    # continue-on-error entfernt werden, damit Lint-Pflicht wird.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintDebug
